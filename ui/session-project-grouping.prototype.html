<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#202422;background:#f5f6f5;font-size:14px}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{cursor:pointer}button{border:0;background:none;color:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:190px 1fr}.sidebar{background:#fff;border-right:1px solid #e7eae8;padding:24px 16px;display:flex;flex-direction:column;gap:12px}.brand{font-size:18px;font-weight:750;display:flex;align-items:center;gap:10px;margin-bottom:22px}.logo{width:32px;height:32px;display:grid;place-items:center;background:#23805d;color:white;border-radius:10px}.navlabel{font-size:12px;color:#999;margin:0 7px}.navitem{padding:10px;border-radius:8px;text-align:left;color:#69736c}.navitem.active{color:#1d7956;background:#edf7f1;font-weight:650}.settings{margin-top:auto;color:#86918a;padding:10px}.main{min-width:0;padding:28px 32px 90px;max-width:1920px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.head h1{font-size:23px;letter-spacing:-.5px;margin:0 0 5px}.head p,.sub{font-size:12px;color:#929a95;margin:0}.prototype-badge{font-size:11px;background:#edf4f0;color:#57806a;padding:5px 9px;border-radius:20px}.toolbar{display:flex;align-items:flex-end;gap:10px;margin:28px 0 15px}.seg{display:flex;border:1px solid #e2e7e4;border-radius:9px;background:white;padding:3px;flex:none}.seg button{padding:7px 12px;font-size:12px;color:#78847d;border-radius:6px}.seg button.on{background:#edf4f0;color:#245f46;font-weight:700}.search{height:38px;border:1px solid #e1e6e3;border-radius:8px;background:#fff;display:flex;align-items:center;gap:9px;color:#a1aaa4;padding:0 12px;flex:1;min-width:90px}.search input{border:0;outline:0;width:100%;background:none;font-size:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#8b958f}.field select,.field input{height:38px;border:1px solid #e1e6e3;background:white;border-radius:8px;padding:0 10px;color:#344039}.field select{min-width:148px}.group-toggle{height:38px;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid #dfe7e1;border-radius:8px;background:#fff;white-space:nowrap;font-size:12px}.switch{width:28px;height:16px;border-radius:20px;background:#c7cfca;position:relative}.switch:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}.group-toggle[aria-pressed=true]{color:#1d7956;border-color:#a4d4b6;background:#f3faf5}.group-toggle[aria-pressed=true] .switch{background:#258661}.group-toggle[aria-pressed=true] .switch:after{left:14px}.bulk{height:38px;padding:0 13px;border:1px solid #d7dfda;border-radius:8px;background:white;white-space:nowrap;font-size:12px;color:#59645d}.bulk:hover,.outline:hover{border-color:#7eb596;color:#26754f}.context{display:flex;align-items:center;justify-content:space-between;gap:15px;color:#8b958f;font-size:11px;margin-bottom:16px}.context strong{color:#668476;font-weight:600}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.column{min-width:0}.colhead{display:flex;align-items:center;gap:8px;padding:3px 1px 10px;font-weight:700;font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:#548dd8;box-shadow:0 0 0 3px #edf3fc}.dot.pending{background:#ad5b27;box-shadow:0 0 0 3px #faf1eb}.dot.done{background:#4b9973;box-shadow:0 0 0 3px #eef7f0}.count{font-size:11px;color:#a0a9a3;font-weight:400;margin-left:auto}.datebar{display:flex;gap:5px;align-items:center;padding:8px;background:#f5f7f5;border:1px solid #ebefec;border-radius:9px;margin-bottom:10px;color:#89928c;font-size:11px}.datebar select,.datebar input{border:0;background:transparent;color:#526059;font-size:11px;min-width:0}.datebar input{width:105px}.datebar select{flex:1}.group{background:#fff;border:1px solid #e5eae6;border-radius:11px;margin:0 0 10px;overflow:hidden}.grouphead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 12px 10px}.grouphead:hover{background:#fafcfb}.groupicon{width:25px;height:25px;background:#edf5f0;border-radius:7px;display:grid;place-items:center;color:#458364;font-size:12px}.groupname{font-weight:700;font-size:12px}.groupcount{color:#a4ada7;font-size:11px;font-weight:400}.chev{margin-left:auto;color:#9ca7a0}.groupactions{padding:0 12px 10px;display:flex;align-items:center;justify-content:space-between;color:#a5aea8;font-size:10px}.link{color:#2b805c;font-size:11px;padding:0}.cards{padding:0 8px 8px}.card{background:#fff;border:1px solid #e8ece9;border-radius:9px;padding:12px;margin-bottom:7px;box-shadow:0 2px 4px #19342508}.cards .card{background:#fbfcfb}.card:last-child{margin-bottom:0}.cardtop{display:flex;gap:6px;align-items:flex-start}.title{font-weight:650;font-size:12px;line-height:1.5;flex:1}.project-tag{font-size:10px;padding:3px 6px;border-radius:5px;color:#5e8070;background:#edf5ef;white-space:nowrap}.desc{font-size:11px;color:#8b958f;line-height:1.6;margin:7px 0}.meta{font-size:10px;color:#a8b0ab;line-height:1.7}.foot{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:10px;color:#8b958f}.foot .spacer{flex:1}.status{border-radius:20px;background:#eaf2fd;color:#4a7dc1;padding:4px 7px;font-weight:650}.status.pending{background:#fbefe8;color:#b66b38}.status.interrupted{background:#fbece9;color:#bd6554}.status.done{background:#ebf5ed;color:#53906b}.action{color:#668475;font-size:10px;white-space:nowrap}.card .action:hover{text-decoration:underline}.empty{text-align:center;color:#b7bfba;border:1px dashed #e0e6e2;border-radius:9px;padding:25px 10px;font-size:11px}.row-section{background:white;border:1px solid #e4ebe6;border-radius:12px;margin-bottom:13px;padding:14px}.row-title{display:flex;align-items:center;gap:9px;margin-bottom:13px}.row-title strong{font-size:13px}.row-title .link{margin-left:auto}.row-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.minihead{font-size:11px;color:#809087;margin-bottom:8px;font-weight:650}.listgroup{border:1px solid #e3eae5;border-radius:11px;background:white;margin-bottom:12px;overflow:hidden}.listgroup .grouphead{padding:14px}.listrow{display:grid;grid-template-columns:125px minmax(170px,1fr) minmax(190px,1.1fr) 175px 115px;align-items:center;gap:14px;padding:13px 15px;border-top:1px solid #edf0ee;font-size:11px}.listrow .desc{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:#a0aaa3}.listrow .foot{margin:0}.fixed-switch{position:fixed;z-index:5;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:7px 10px;color:#fff;background:#25352d;border-radius:999px;box-shadow:0 8px 25px #213d2c33;font-size:11px}.fixed-switch button{color:white;padding:3px 8px;font-size:15px}.fixed-switch span{min-width:148px;text-align:center}.modal-bg{position:fixed;inset:0;background:#19282060;display:grid;place-items:center;z-index:10;padding:20px}.modal-bg[hidden]{display:none}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:24px;box-shadow:0 16px 60px #172b1d30}.modal h2{margin:0 0 10px;font-size:18px}.modal p{font-size:13px;line-height:1.7;color:#68766e}.impact{background:#f6f8f6;border-radius:9px;padding:12px;line-height:1.9;font-size:12px;color:#526157}.selection-label{font-weight:650;font-size:12px;margin:15px 0 8px;color:#435249}.selection-statuses{display:flex;flex-wrap:wrap;gap:7px}.selection-statuses label{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #e2e9e4;border-radius:8px;font-size:12px;color:#526157}.selection-statuses input,.selection-list input{accent-color:#25845d}.selection-list{border:1px solid #e6ece8;border-radius:9px;max-height:215px;overflow:auto}.selection-item{display:flex;align-items:center;gap:9px;padding:10px;border-bottom:1px solid #eef1ef;font-size:12px}.selection-item:last-child{border-bottom:0}.selection-item span{flex:1}.selection-item small{color:#93a098}.selection-empty{font-size:11px;color:#99a59e;padding:12px}.primary:disabled{opacity:.45;cursor:not-allowed}.warning{background:#fff6ed;color:#9d5d22;padding:10px;border-radius:8px;font-size:11px;line-height:1.6;margin-top:10px}.modalbuttons{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.outline,.primary{border-radius:8px;padding:9px 14px;font-size:12px}.outline{border:1px solid #dfe6e0}.primary{background:#25845d;color:white}.toast{position:fixed;right:25px;bottom:25px;background:#244937;color:white;padding:10px 15px;border-radius:8px;font-size:12px;z-index:12}.toast:empty{display:none}@media(max-width:1000px){.sidebar{width:68px;padding:20px 8px}.shell{grid-template-columns:68px 1fr}.brand{justify-content:center}.brand span:not(.logo),.navlabel,.navitem span,.settings span{display:none}.navitem{text-align:center}.toolbar{flex-wrap:wrap}.search{order:3;flex-basis:100%}.board,.row-columns{gap:9px}.main{padding:23px 18px 85px}.listrow{grid-template-columns:85px 1fr 130px}.listrow .desc,.listrow .meta{display:none}}@media(max-width:680px){.shell{display:block}.sidebar{width:auto;height:52px;display:flex;flex-direction:row;padding:10px 15px;align-items:center}.brand{margin:0}.sidebar .navitem,.settings{display:none}.main{padding:20px 12px 80px}.toolbar{gap:7px}.field select{min-width:110px}.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.column{flex:0 0 85%;scroll-snap-align:start}.row-columns{grid-template-columns:1fr}.listrow{grid-template-columns:82px 1fr 90px;gap:6px}.context{align-items:flex-start;flex-direction:column;gap:3px}}
</style></head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">a</span><span>ai-todos</span></div><div class="navlabel">工作空间</div><button class="navitem active">◉ <span>会话</span></button><button class="navitem">◷ <span>会话记录</span></button><div class="settings">⚙ <span>设置</span></div></aside><main class="main"><header class="head"><div><h1>会话</h1><p>先处理需要你的事，再关注正在运行的会话</p></div><span class="prototype-badge">交互设计稿 · 示例数据</span></header>
<div class="toolbar"><div class="seg"><button id="listMode">列表</button><button id="boardMode" class="on">看板</button></div><label class="search">⌕ <input id="search" placeholder="搜索会话或概要…" aria-label="搜索会话"></label><button id="groupToggle" class="group-toggle" aria-pressed="true"><span class="switch"></span> 按项目分组</button><label class="field">项目<select id="project"><option value="all">全部项目</option></select></label><button class="bulk" id="completeAll">✓✓ 一键全部完成</button></div>
<div class="context"><span>时间范围按 <strong>创建时间 — 最后活跃时间</strong> 与所选范围是否重叠判断</span><span id="context-state"></span></div><div id="content"></div></main></div>
<div class="fixed-switch"><button id="prev" aria-label="上一个方案">‹</button><span id="variantLabel"></span><button id="next" aria-label="下一个方案">›</button></div>
<div class="modal-bg" id="modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalDesc"></p><div class="impact" id="modalImpact"></div><div id="modalSelection" hidden></div><div class="warning" id="modalWarning" hidden></div><div class="modalbuttons"><button class="outline" id="cancel">取消</button><button class="primary" id="confirm">确认完成</button></div></section></div><div class="toast" id="toast"></div>
<script>
// 三种会话分组方案；所有操作只修改当前页面的示例数据。
const initial=[
{id:1,project:'onedata-local',status:'running',title:'执行 Relay SSH MCP 方案',desc:'实现中转机连接与 MCP 工具，验证远程命令调用和权限边界。',start:'2026-11-16',last:'2026-11-17',time:'20:22'},
{id:2,project:'kcard',status:'running',title:'卡权益迁移 2.0',desc:'继续推进迁移流程，核对接口契约和阶段性验收结果。',start:'2026-11-13',last:'2026-11-17',time:'20:21'},
{id:3,project:'kmall',status:'pending',title:'核实订单飞涨比例',desc:'排查订单数据异常，整理查询条件、样本和待确认结论。',start:'2026-11-15',last:'2026-11-17',time:'17:04'},
{id:4,project:'kmall',status:'interrupted',title:'核对异常订单链路',desc:'会话中断，已记录查询结果；可以继续处理，也可以确认归档。',start:'2026-11-14',last:'2026-11-16',time:'16:30'},
{id:5,project:'ai-todos',status:'pending',title:'设计会话状态与项目分组',desc:'整理按项目展示、批量确认及时间范围筛选的交互方案。',start:'2026-11-17',last:'2026-11-17',time:'19:53'},
{id:6,project:'ai-todos',status:'done',title:'验证 MCP 与安装包',desc:'检查构建产物与本机插件入口，记录验证结果。',start:'2026-11-15',last:'2026-11-17',time:'19:10'},
{id:7,project:'onedata-local',status:'done',title:'修复内网代理规则',desc:'核对内网域名代理匹配结果，整理调整后的规则。',start:'2026-11-14',last:'2026-11-16',time:'19:07'},
{id:8,project:'未关联项目',status:'done',title:'分析本地大文件占用',desc:'梳理磁盘空间占用情况并列出可复核的清理建议。',start:'2026-11-12',last:'2026-11-16',time:'16:05'}];
let sessions=structuredClone(initial),grouped=true,mode='board',variant=new URLSearchParams(location.search).get('variant')||'A',periods={pending:'2',done:'2'},ranges={pending:{from:'2026-11-15',to:'2026-11-17'},done:{from:'2026-11-15',to:'2026-11-17'}},closed=new Set(),pendingAction=null;
const labels={running:'进行中',pending:'待确认',done:'已完成'}, variants={A:'A · 状态列内分组',B:'B · 项目泳道',C:'C · 项目清单'},colors={running:'',pending:'pending',done:'done'};
const $=s=>document.querySelector(s), escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const column=s=>s.status==='interrupted'?'pending':s.status;
const projects=[...new Set(initial.map(s=>s.project))];
$('#project').insertAdjacentHTML('beforeend',projects.map(p=>`<option>${escapeText(p)}</option>`).join(''));
// 状态时间范围仅作用于待确认和已完成；会话时间区间与查询区间有交集即显示。
function matches(s){
 const project=$('#project').value, query=$('#search').value.trim().toLowerCase(), key=column(s);
 if(project!=='all'&&s.project!==project)return false;
 if(query&&!`${s.title} ${s.desc} ${s.project}`.toLowerCase().includes(query))return false;
 if(key==='running'||periods[key]==='all')return true;
 const {from,to}=ranges[key];return (!to||s.start<=to)&&(!from||s.last>=from);
}
function datebar(key){if(key==='running')return '';const r=ranges[key];return `<div class="datebar"><span>时间</span><select data-period="${key}" aria-label="${labels[key]}时间范围"><option value="2" ${periods[key]==='2'?'selected':''}>近 2 天</option><option value="7" ${periods[key]==='7'?'selected':''}>近 7 天</option><option value="all" ${periods[key]==='all'?'selected':''}>全部时间</option><option value="custom" ${periods[key]==='custom'?'selected':''}>自定义范围</option></select>${periods[key]==='custom'?`<input type="date" data-range="${key}:from" value="${r.from}"> — <input type="date" data-range="${key}:to" value="${r.to}">`:''}</div>`}
function card(s,showProject=false){const state=s.status==='interrupted'?'interrupted':column(s), label=s.status==='interrupted'?'已中断':s.status==='pending'?'待确认完成':s.status==='running'?'正在执行':'已完成';return `<article class="card"><div class="cardtop"><span class="title">${escapeText(s.title)}</span>${showProject?`<span class="project-tag">${escapeText(s.project)}</span>`:'<span class="muted">⌄</span>'}</div><p class="desc">${escapeText(s.desc)}</p><div class="meta">创建 ${s.start} 10:00 · 活跃 ${s.last} ${s.time}</div><div class="foot"><span class="status ${state}">${label}</span><span class="spacer"></span><button class="action" data-open="${s.id}">↗ 打开会话</button>${['pending','interrupted'].includes(s.status)?`<button class="action" data-one="${s.id}">${s.status==='interrupted'?'确认归档':'确认完成'}</button>`:''}</div></article>`}
function group(key,project,items){const id=`${key}:${project}`,folded=closed.has(id),pending=items.filter(s=>s.status==='pending').length;return `<section class="group"><button class="grouphead" data-fold="${escapeText(id)}" aria-expanded="${!folded}"><span class="groupicon">▣</span><span class="groupname">${escapeText(project)} <span class="groupcount">${items.length} 个会话</span></span><span class="chev">${folded?'›':'⌄'}</span></button>${folded?'':`<div class="groupactions"><span>${key==='pending'?'含待确认及异常会话':'按最近活跃排序'}</span>${key==='pending'&&pending?`<button class="link" data-project-confirm="${escapeText(project)}">✓ 一键完成待确认 (${pending})</button>`:''}</div><div class="cards">${items.map(s=>card(s)).join('')}</div>`}</section>`}
function renderColumns(items){return `<div class="board">${['running','pending','done'].map(key=>{const rows=items.filter(s=>column(s)===key),groups=[...new Set(rows.map(s=>s.project))];return `<section class="column"><div class="colhead"><i class="dot ${colors[key]}"></i>${labels[key]}<span class="count">${rows.length} 会话</span></div>${datebar(key)}${!rows.length?'<div class="empty">当前范围内没有会话</div>':grouped?groups.map(p=>group(key,p,rows.filter(s=>s.project===p))).join(''):rows.map(s=>card(s,true)).join('')}</section>`}).join('')}</div>`}
function renderLanes(items){return `<div class="board">${['running','pending','done'].map(k=>`<div><div class="colhead"><i class="dot ${colors[k]}"></i>${labels[k]}<span class="count">${items.filter(s=>column(s)===k).length} 会话</span></div>${datebar(k)}</div>`).join('')}</div>${[...new Set(items.map(s=>s.project))].map(p=>{const rows=items.filter(s=>s.project===p),pending=rows.filter(s=>s.status==='pending').length;return `<section class="row-section"><div class="row-title"><span class="groupicon">▣</span><strong>${escapeText(p)}</strong><span class="groupcount">${rows.length} 个会话</span>${pending?`<button class="link" data-project-confirm="${escapeText(p)}">✓ 一键完成该项目待确认 (${pending})</button>`:''}</div><div class="row-columns">${['running','pending','done'].map(k=>`<div><div class="minihead">${labels[k]} · ${rows.filter(s=>column(s)===k).length}</div>${rows.filter(s=>column(s)===k).map(s=>card(s)).join('')||'<div class="empty">暂无会话</div>'}</div>`).join('')}</div></section>`}).join('')||'<div class="empty">当前范围内没有会话</div>'}`}
function renderList(items){return `<div class="board">${['running','pending','done'].map(k=>`<div><div class="colhead"><i class="dot ${colors[k]}"></i>${labels[k]}<span class="count">${items.filter(s=>column(s)===k).length} 会话</span></div>${datebar(k)}</div>`).join('')}</div>${[...new Set(items.map(s=>s.project))].map(p=>{const rows=items.filter(s=>s.project===p),pending=rows.filter(s=>s.status==='pending').length,id=`list:${p}`,folded=closed.has(id);return `<section class="listgroup"><button class="grouphead" data-fold="${escapeText(id)}" aria-expanded="${!folded}"><span class="groupicon">▣</span><span class="groupname">${escapeText(p)} <span class="groupcount">${rows.length} 个会话</span></span><span class="chev">${folded?'›':'⌄'}</span></button>${folded?'':`${pending?`<div class="groupactions"><span>按项目查看所有状态</span><button class="link" data-project-confirm="${escapeText(p)}">✓ 一键完成待确认 (${pending})</button></div>`:''}${rows.map(s=>`<div class="listrow"><span><span class="status ${s.status==='interrupted'?'interrupted':column(s)}">${s.status==='interrupted'?'已中断':labels[column(s)]}</span></span><strong>${escapeText(s.title)}</strong><span class="desc">${escapeText(s.desc)}</span><span class="meta">创建 ${s.start} 10:00<br>活跃 ${s.last} ${s.time}</span><div class="foot">${['pending','interrupted'].includes(s.status)?`<button class="action" data-one="${s.id}">${s.status==='interrupted'?'确认归档':'确认完成'}</button>`:'<span class="muted">↗ 打开会话</span>'}</div></div>`).join('')}`}</section>`}).join('')||'<div class="empty">当前范围内没有会话</div>'}`}
function render(){
 const items=sessions.filter(matches);$('#context-state').textContent=`展示 ${items.length} 个会话 · ${grouped?'已按项目分组':'未分组'} · 最近 2 天为默认筛选`;
 $('#groupToggle').setAttribute('aria-pressed',String(grouped));$('#variantLabel').textContent=variants[variant];$('#boardMode').classList.toggle('on',mode==='board');$('#listMode').classList.toggle('on',mode==='list');
 $('#content').innerHTML=!grouped?renderColumns(items):mode==='list'||variant==='C'?renderList(items):variant==='B'?renderLanes(items):renderColumns(items);
}
function openDialog(kind,ids,project){
 // 批量操作默认选择待确认与中断会话；运行中的会话必须主动勾选。
 const items=sessions.filter(s=>ids.includes(s.id)&&s.status!=='done');
 if(!items.length){showToast('当前没有可处理的会话');return}
 pendingAction={kind,items,selected:new Set(items.filter(s=>s.status!=='running').map(s=>s.id))};
 if(kind==='one')pendingAction.selected.add(items[0].id);
 $('#modalTitle').textContent=kind==='all'?'选择要完成的会话':kind==='project'?`选择 ${project} 的待确认会话`:items[0].status==='interrupted'?'确认归档中断会话？':'确认完成该会话？';
 $('#modalDesc').textContent=kind==='all'?'当前筛选范围内，按状态或单个会话选择；已完成的会话不在操作范围内。':kind==='project'?'选择当前筛选范围内该项目的待确认会话。':'确认后该会话将显示在已完成中。';
 $('#modalSelection').hidden=kind==='one';
 updateDialog();$('#modal').hidden=false;$('#cancel').focus();
}
// 状态勾选与单条勾选共享同一选择集合，汇总和运行中提示随之更新。
function updateDialog(){
 const {items,selected,kind}=pendingAction, chosen=items.filter(s=>selected.has(s.id));
 const running=chosen.filter(s=>s.status==='running').length;
 $('#modalImpact').innerHTML=`已选择 <strong>${chosen.length}</strong> / ${items.length} 个会话`;
 $('#modalWarning').hidden=!running;$('#modalWarning').textContent=`已选择 ${running} 个运行中的会话。标记完成不会停止实际运行，后续活动可能改变它的状态。`;
 $('#confirm').disabled=!chosen.length;
 $('#confirm').textContent=kind==='one'&&items[0].status==='interrupted'?'确认归档':`确认完成${kind==='one'?'':`（${chosen.length}）`}`;
 if(kind==='one')return;
 const statusNames={running:'进行中',pending:'待确认',interrupted:'已中断'};
 const statuses=['running','pending','interrupted'].filter(status=>items.some(s=>s.status===status));
 $('#modalSelection').innerHTML=`<div class="selection-label">按状态选择</div><div class="selection-statuses">${statuses.map(status=>{const list=items.filter(s=>s.status===status),count=list.filter(s=>selected.has(s.id)).length;return `<label><input type="checkbox" data-select-status="${status}" ${count===list.length?'checked':''}><span>${statusNames[status]} ${count}/${list.length}</span></label>`}).join('')}</div><div class="selection-label">逐个选择会话</div><div class="selection-list">${items.map(s=>`<label class="selection-item"><input type="checkbox" data-select-id="${s.id}" ${selected.has(s.id)?'checked':''}><span>${escapeText(s.title)}<br><small>${escapeText(s.project)} · ${statusNames[s.status]}</small></span></label>`).join('')}</div>`;
 for(const input of $('#modalSelection').querySelectorAll('[data-select-status]')){const list=items.filter(s=>s.status===input.dataset.selectStatus),count=list.filter(s=>selected.has(s.id)).length;input.indeterminate=count>0&&count<list.length}
}

function showToast(text){$('#toast').textContent=text;setTimeout(()=>$('#toast').textContent='',2500)}
function switchVariant(delta){const keys=['A','B','C'];variant=keys[(keys.indexOf(variant)+delta+keys.length)%keys.length];const url=new URL(location);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
$('#groupToggle').onclick=()=>{grouped=!grouped;render()};$('#project').onchange=render;$('#search').oninput=render;$('#listMode').onclick=()=>{mode='list';render()};$('#boardMode').onclick=()=>{mode='board';render()};$('#prev').onclick=()=>switchVariant(-1);$('#next').onclick=()=>switchVariant(1);
$('#completeAll').onclick=()=>openDialog('all',sessions.filter(matches).map(s=>s.id));$('#cancel').onclick=()=>{$('#modal').hidden=true;pendingAction=null};
$('#confirm').onclick=()=>{if(!pendingAction||!pendingAction.selected.size)return;const selected=pendingAction.selected;sessions=sessions.map(s=>selected.has(s.id)?{...s,status:'done'}:s);$('#modal').hidden=true;showToast(`示例操作完成：${selected.size} 个会话`);pendingAction=null;render()};
$('#modalSelection').addEventListener('change',event=>{const el=event.target;if(el.dataset.selectId){const id=Number(el.dataset.selectId);el.checked?pendingAction.selected.add(id):pendingAction.selected.delete(id)}if(el.dataset.selectStatus)for(const item of pendingAction.items.filter(s=>s.status===el.dataset.selectStatus))el.checked?pendingAction.selected.add(item.id):pendingAction.selected.delete(item.id);updateDialog()});
$('#content').addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.fold){closed.has(b.dataset.fold)?closed.delete(b.dataset.fold):closed.add(b.dataset.fold);render()}if(b.dataset.projectConfirm)openDialog('project',sessions.filter(s=>matches(s)&&s.project===b.dataset.projectConfirm&&s.status==='pending').map(s=>s.id),b.dataset.projectConfirm);if(b.dataset.one)openDialog('one',[Number(b.dataset.one)]);if(b.dataset.open)showToast('设计稿示意：打开会话')});
$('#content').addEventListener('change',event=>{const el=event.target;if(el.dataset.period){const key=el.dataset.period;periods[key]=el.value;if(el.value==='2')ranges[key]={from:'2026-11-15',to:'2026-11-17'};if(el.value==='7')ranges[key]={from:'2026-11-10',to:'2026-11-17'};render()}if(el.dataset.range){const [key,side]=el.dataset.range.split(':');ranges[key][side]=el.value;render()}});
document.addEventListener('keydown',event=>{if(event.target.matches('input,textarea,select,[contenteditable]')||!$('#modal').hidden)return;if(event.key==='ArrowLeft')switchVariant(-1);if(event.key==='ArrowRight')switchVariant(1)});
if(!variants[variant])variant='A';render();
</script></body></html>
